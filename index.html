

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adhésion - Cultivons l'Amour</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f7f3;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }
    h1 { color: #176b3a; text-align: center; }
    p { line-height: 1.5; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #176b3a;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }
    button:disabled { opacity: .6; }
    .note { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CULTIVONS L’AMOUR</h1>
    <p><strong>Formulaire officiel d’adhésion</strong></p>
    <p>Bienvenue ! Rejoignez notre initiative humanitaire pour soutenir les orphelins, les veuves et les familles vulnérables.</p>

    <form id="adhesionForm">
      <label for="nom_groupe">Nom du groupe ou de la représentation *</label>
      <input id="nom_groupe" required>

      <label for="province">Province *</label>
      <input id="province" required>

      <label for="ville">Ville *</label>
      <input id="ville" required>

      <label for="commune">Commune (facultatif)</label>
      <input id="commune">

      <label for="adresse">Adresse (facultatif)</label>
      <input id="adresse">

      <label for="domaine">Domaine d'action *</label>
      <select id="domaine" required>
        <option value="">Choisir un domaine</option>
        <option value="Humanitaire">Aide humanitaire</option>
        <option value="Orphelins">Protection des orphelins</option>
        <option value="Veuves">Soutien aux veuves</option>
        <option value="Familles vulnérables">Aide aux familles vulnérables</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="objectifs">Objectifs du groupe *</label>
      <textarea id="objectifs" rows="3" required></textarea>

      <label for="activites">Activités prévues (facultatif)</label>
      <textarea id="activites" rows="3"></textarea>

      <label for="nom_responsable">Nom complet du responsable *</label>
      <input id="nom_responsable" required>

      <label for="fonction_responsable">Fonction du responsable *</label>
      <input id="fonction_responsable" placeholder="Ex. : Président, secrétaire..." required>

      <label for="telephone">Numéro de téléphone *</label>
      <input id="telephone" type="tel" required>

      <label for="email">Adresse e-mail (facultatif)</label>
      <input id="email" type="email">

      <button id="submitBtn" type="submit">Envoyer ma demande</button>
      <p class="note" id="message" role="status" aria-live="polite">
        Les champs marqués d'un * sont obligatoires.
      </p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jxjgojkttdikclpdlxsq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RGzT_RkhsFrE_ixCEoL6qw_rd8qPGtF";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("adhesionForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      submitBtn.disabled = true;
      message.textContent = "Envoi de votre demande en cours...";

      const data = {
        nom_groupe: document.getElementById("nom_groupe").value.trim(),
        province: document.getElementById("province").value.trim(),
        ville: document.getElementById("ville").value.trim(),
        commune: document.getElementById("commune").value.trim() || null,
        adresse: document.getElementById("adresse").value.trim() || null,
        domaine: document.getElementById("domaine").value,
        objectifs: document.getElementById("objectifs").value.trim(),
        activites: document.getElementById("activites").value.trim() || null,
        nom_responsable: document.getElementById("nom_responsable").value.trim(),
        fonction_responsable: document.getElementById("fonction_responsable").value.trim(),
        telephone: document.getElementById("telephone").value.trim(),
        email: document.getElementById("email").value.trim() || null
      };

      try {
        const { error } = await supabaseClient
          .from("adhesions")
          .insert([data]);

        if (error) throw error;

        message.textContent =
          "Votre demande a été envoyée avec succès ! Merci de rejoindre CULTIVONS L’AMOUR.";
        form.reset();
      } catch (error) {
        console.error("Erreur d'envoi :", error);
        message.textContent =
          "Échec de l'envoi. Vérifiez votre connexion ou contactez le comité si le problème persiste.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
